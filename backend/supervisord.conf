[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

# ── Node.js Backend (Express server) ────────────────────────────
[program:node-backend]
command=node /app/node-backend/server.js
directory=/app/node-backend
autostart=true
autorestart=true
stderr_logfile=/tmp/node-backend.err.log
stdout_logfile=/tmp/node-backend.out.log
stopasgroup=true
priority=999

# ── AI Service (Spring Boot on port 8080) ──────────────────────
[program:ai-service]
command=java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -jar /app/ai-service/app.jar
directory=/app/ai-service
autostart=true
autorestart=true
stderr_logfile=/tmp/ai-service.err.log
stdout_logfile=/tmp/ai-service.out.log
environment=SERVER_PORT=8080,SPRING_PROFILES_ACTIVE=docker
stopasgroup=true
priority=998

# ── Payment Service (Spring Boot on port 8081) ─────────────────
[program:payment-service]
command=java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -jar /app/payment-service/app.jar
directory=/app/payment-service
autostart=true
autorestart=true
stderr_logfile=/tmp/payment-service.err.log
stdout_logfile=/tmp/payment-service.out.log
environment=SERVER_PORT=8081,SPRING_PROFILES_ACTIVE=docker
stopasgroup=true
priority=997

# ── Group to manage all services together ────────────────────────
[group:eventhub-services]
programs=node-backend,ai-service,payment-service
priority=999
