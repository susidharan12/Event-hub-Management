<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/Public/js/dark-mode.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="icon" type="image/svg+xml" href="/Public/favicon.svg">
  <title>Offline — EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary:#6366f1; --primary-2:#8b5cf6; --secondary:#ec4899; --ink:#1f2937; --muted:#64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: grid; place-items: center;
      padding: 1.5rem;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(139,92,246,0.18), transparent 50%),
        radial-gradient(800px 500px at 85% 25%, rgba(236,72,153,0.16), transparent 50%),
        linear-gradient(180deg, #ffffff 0%, #f5f3ff 100%);
      text-align: center;
      overflow: hidden;
    }
    .card {
      max-width: 420px; width: 100%;
      background: rgba(255,255,255,0.85);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border: 1px solid rgba(99,102,241,0.12);
      border-radius: 26px;
      padding: 2.4rem 1.6rem;
      box-shadow: 0 24px 60px rgba(15,23,42,0.14);
      animation: rise .6s cubic-bezier(.2,.8,.3,1) both;
    }
    @keyframes rise { from { opacity:0; transform: translateY(20px);} to { opacity:1; transform:none; } }
    .icon {
      width: 84px; height: 84px; margin: 0 auto 1.2rem;
      border-radius: 24px;
      display: grid; place-items: center;
      color: #fff; font-size: 2.1rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-2), var(--secondary));
      box-shadow: 0 14px 30px rgba(99,102,241,0.4);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-8px);} }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; letter-spacing: -.02em; margin-bottom: .5rem; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: .95rem 1.2rem;
      border: none; border-radius: 14px;
      font: 700 1rem/1 'Inter', sans-serif; color: #fff; cursor: pointer;
      background: linear-gradient(120deg, var(--primary), var(--primary-2), var(--secondary));
      box-shadow: 0 10px 24px rgba(99,102,241,0.4);
      transition: transform .15s ease;
    }
    button:active { transform: scale(.97); }
    .hint { margin-top: 1rem; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fas fa-wifi"></i></div>
    <h1>You're offline</h1>
    <p>EventHub can't reach the network right now. Check your connection and try again — your cached pages still work.</p>
    <button onclick="location.reload()"><i class="fas fa-rotate-right"></i> Try again</button>
    <div class="hint">Tip: install EventHub to your home screen for a faster, app-like experience.</div>
  </div>
  <script>
    // Auto-retry the moment connectivity returns.
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
