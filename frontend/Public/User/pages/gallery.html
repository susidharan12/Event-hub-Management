<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/Public/js/api-base-shim.js"></script>
  <script src="/Public/js/dark-mode.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — EventHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{ --ink:#1f2937; --muted:#64748b; --primary:#6366f1; --bg:#f6f7fb; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);}
    a{color:inherit;text-decoration:none}
    .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eef;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;}
    .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;}
    .back{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);}
    .hero{padding:34px 20px 10px;text-align:center;}
    .hero h1{margin:0;font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;}
    .hero p{color:var(--muted);margin:.4rem 0 0;}
    .wrap{max-width:1200px;margin:0 auto;padding:18px 20px 60px;}
    .filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 24px;}
    .filters input,.filters select{padding:10px 14px;border:1px solid #e5e7eb;border-radius:999px;background:#fff;font-size:.9rem;outline:none;}
    .filters input:focus,.filters select:focus{border-color:var(--primary);}
    .grid{columns:4 240px;column-gap:14px;}
    .card{break-inside:avoid;margin:0 0 14px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 6px 18px -12px rgba(15,23,42,.4);cursor:pointer;position:relative;transition:transform .15s;}
    .card:hover{transform:translateY(-3px);}
    .card img,.card video{width:100%;display:block;}
    .card .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:2.4rem;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;}
    .card .meta{padding:10px 12px;}
    .card .cap{font-weight:700;font-size:.9rem;line-height:1.25;}
    .card .sub{color:var(--muted);font-size:.75rem;margin-top:3px;}
    .vidtile{height:160px;background:linear-gradient(135deg,#1e293b,#334155);}
    .empty{text-align:center;color:var(--muted);padding:60px 0;}
    /* Lightbox */
    .lb{position:fixed;inset:0;background:rgba(8,11,20,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
    .lb.open{display:flex;}
    .lb-inner{max-width:90vw;max-height:88vh;}
    .lb-inner img{width:75vw;height:78vh;object-fit:contain;border-radius:12px;display:block;}
    .lb-inner video{width:75vw;max-height:82vh;border-radius:12px;display:block;background:#000;}
    .lb-inner iframe{width:min(85vw,1100px);height:min(82vh,620px);border:0;border-radius:12px;}
    .lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:1.8rem;cursor:pointer;background:none;border:none;}
    .lb-cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#e2e8f0;font-size:.9rem;}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/Public/User/pages/events.html"><span class="logo"><i class="fas fa-bolt"></i></span> Event<span style="color:var(--primary)">Hub</span></a>
    <a class="back" href="/Public/User/pages/events.html"><i class="fas fa-arrow-left"></i> Back to events</a>
  </div>

  <div class="hero">
    <h1>Moments from our events</h1>
    <p>Relive the highlights — photos and videos from past events.</p>
  </div>

  <div class="wrap">
    <div class="filters">
      <select id="f-type"><option value="">Photos &amp; videos</option><option value="image">Photos</option><option value="video">Videos</option></select>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none;"><i class="fas fa-images" style="font-size:2rem;opacity:.4"></i><p>No media yet. Check back after the next event!</p></div>
  </div>

  <div class="lb" id="lb">
    <button class="lb-close" id="lb-close">&times;</button>
    <div class="lb-inner" id="lb-inner"></div>
    <div class="lb-cap" id="lb-cap"></div>
  </div>

  <script>
  (function () {
    let ALL = [];
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function resolveMediaUrl(url) {
      if (!url) return url;
      if (url.startsWith('http')) return url;  // Already absolute (YouTube, etc)
      if (url.startsWith('/')) return window.location.origin + url;  // Relative path
      return url;
    }

    function ytId(url) { const m = String(url).match(/embed\/([A-Za-z0-9_-]{11})/); return m ? m[1] : null; }
    function thumbFor(m) {
      const resolved = resolveMediaUrl(m.url);
      if (m.type === 'image') return resolved;
      if (m.source === 'embed') { const id = ytId(m.url); return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : null; }
      return null; // self-hosted video → rendered as <video>
    }

    function cardHtml(m, i) {
      const t = thumbFor(m);
      const resolvedUrl = resolveMediaUrl(m.url);
      let media;
      if (m.type === 'image') media = `<img loading="lazy" src="${esc(resolvedUrl)}" alt="${esc(m.caption || '')}">`;
      else if (t) media = `<img loading="lazy" src="${esc(t)}" alt=""><div class="play"><i class="fas fa-circle-play"></i></div>`;
      else media = `<div class="vidtile"></div><div class="play"><i class="fas fa-circle-play"></i></div>`;
      const meta = m.caption ? `<div class="meta"><div class="cap">${esc(m.caption)}</div></div>` : '';
      return `<div class="card" data-i="${i}">${media}${meta}</div>`;
    }

    function render() {
      const typ = document.getElementById('f-type').value;
      const items = ALL.filter((m) => (!typ || m.type === typ));
      grid.innerHTML = items.map((m) => cardHtml(m, ALL.indexOf(m))).join('');
      empty.style.display = items.length ? 'none' : 'block';
    }

    function openLightbox(m) {
      const inner = document.getElementById('lb-inner');
      const resolvedUrl = resolveMediaUrl(m.url);
      if (m.type === 'image') inner.innerHTML = `<img src="${esc(resolvedUrl)}">`;
      else if (m.source === 'embed') inner.innerHTML = `<iframe src="${esc(resolvedUrl)}?autoplay=1" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>`;
      else inner.innerHTML = `<video src="${esc(resolvedUrl)}" controls autoplay></video>`;
      document.getElementById('lb-cap').textContent = m.caption || m.event_title || '';
      document.getElementById('lb').classList.add('open');
    }
    function closeLightbox() { document.getElementById('lb-inner').innerHTML = ''; document.getElementById('lb').classList.remove('open'); }

    grid.addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) openLightbox(ALL[Number(c.dataset.i)]); });
    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb').addEventListener('click', (e) => { if (e.target.id === 'lb') closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
    document.getElementById('f-type').addEventListener('change', render);

    (async function load() {
      try {
        const params = new URLSearchParams(location.search);
        const qs = params.get('organizer_id') ? ('?organizer_id=' + params.get('organizer_id')) : '';
        const d = await (await fetch('/api/media' + qs)).json();
        ALL = (d && d.media) || [];
        render();
      } catch (e) { empty.style.display = 'block'; }
    })();
  })();
  </script>
</body>
</html>
