<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/Public/favicon.svg">
  <title>Ticket — EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --primary-2: #8b5cf6;
      --secondary: #ec4899;
      --teal: #06b6d4;
      --ink: #1f2937;
      --muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --gradient-hero: linear-gradient(135deg, #6366f1 0%, #8b5cf6 35%, #ec4899 100%);
      --gradient-soft: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 100%);
      --shadow-card: 0 18px 40px rgba(15, 23, 42, 0.08);
      --shadow-card-hover: 0 30px 60px rgba(99, 102, 241, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--gradient-soft);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      display: grid; place-items: center;
      padding: 2rem 1rem;
      position: relative;
    }
    h1, h2, h3 { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.02em; }

    /* Ambient background */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(90px); opacity: 0.5; pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 420px; height: 420px; background: #8b5cf6; top: -100px; left: -100px; animation: float 14s ease-in-out infinite; }
    .orb-2 { width: 360px; height: 360px; background: #ec4899; bottom: -80px; right: -100px; animation: float 18s ease-in-out infinite -3s; }
    .orb-3 { width: 280px; height: 280px; background: #06b6d4; top: 50%; left: 60%; animation: float 16s ease-in-out infinite -6s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -30px) scale(1.08); }
      66%      { transform: translate(-30px, 20px) scale(0.94); }
    }

    .home-link {
      position: fixed;
      top: 24px; left: 24px;
      z-index: 10;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 0.6rem 1rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      color: var(--ink);
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      border: 1px solid rgba(99,102,241,0.18);
      transition: all 0.25s ease;
    }
    .home-link:hover { background: white; color: var(--primary); transform: translateX(-2px); }

    /* The ticket */
    .ticket {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: white;
      border-radius: 28px;
      box-shadow: 0 40px 80px rgba(15, 23, 42, 0.18);
      overflow: hidden;
      animation: tIn 0.7s cubic-bezier(.2,.9,.3,1.2) both;
    }
    @keyframes tIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header band */
    .t-head {
      position: relative;
      padding: 2rem 1.6rem 1.4rem;
      background: var(--gradient-hero);
      color: white;
      text-align: center;
      overflow: hidden;
    }
    .t-head::before, .t-head::after {
      content: ''; position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.2);
    }
    .t-head::before { width: 220px; height: 220px; top: -120px; right: -120px; animation: floatSlow 9s ease-in-out infinite; }
    .t-head::after  { width: 160px; height: 160px; bottom: -100px; left: -80px; animation: floatSlow 9s ease-in-out infinite -3s; }
    @keyframes floatSlow {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-12px, -16px); }
    }

    .t-status {
      position: relative; z-index: 1;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.32);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .t-status .pulse {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 0 0 rgba(74,222,128,0.6);
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.55); }
      80% { box-shadow: 0 0 0 12px rgba(74,222,128,0); }
      100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
    }

    .t-check {
      position: relative; z-index: 1;
      width: 64px; height: 64px;
      margin: 1rem auto 0.8rem;
      border-radius: 50%;
      background: white;
      color: var(--success);
      display: grid; place-items: center;
      font-size: 1.8rem;
      box-shadow: 0 8px 22px rgba(0,0,0,0.18);
      animation: checkPop 0.5s cubic-bezier(.2,.9,.3,1.2) 0.15s both;
    }
    @keyframes checkPop {
      0%   { transform: scale(0.4); opacity: 0; }
      60%  { transform: scale(1.18); opacity: 1; }
      100% { transform: scale(1); }
    }
    .t-event {
      position: relative; z-index: 1;
      font-size: 1.4rem; font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.2;
      font-family: 'Space Grotesk', sans-serif;
    }
    .t-seat {
      position: relative; z-index: 1;
      font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      opacity: 0.92;
    }

    /* Perforated divider */
    .t-perf {
      position: relative; height: 22px;
      background: white;
      display: flex; align-items: center;
    }
    .t-perf::before, .t-perf::after {
      content: ''; position: absolute;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--gradient-soft);
      top: -16px;
    }
    .t-perf::before { left: -16px; }
    .t-perf::after  { right: -16px; }
    .t-perf .dashes { flex: 1; margin: 0 22px; border-top: 2px dashed #e5e7eb; }

    /* Body */
    .t-body { padding: 1.6rem 1.6rem 1.8rem; }
    .row {
      display: flex; align-items: center; gap: 14px;
      padding: 0.9rem 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .row:last-of-type { border-bottom: none; }
    .row-icon {
      width: 38px; height: 38px;
      border-radius: 11px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(236,72,153,0.15));
      color: var(--primary);
      font-size: 1rem;
      flex-shrink: 0;
    }
    .row .label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .row .value {
      font-weight: 700;
      color: var(--ink);
      margin-top: 2px;
      font-size: 0.98rem;
    }
    .row .value.muted-mono {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 600;
      color: var(--primary);
      font-size: 0.85rem;
      word-break: break-all;
      letter-spacing: 0.04em;
    }

    .t-actions {
      display: flex; gap: 10px;
      padding: 0 1.6rem 1.6rem;
    }
    .btn {
      flex: 1;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--gradient-hero);
      color: white;
      box-shadow: 0 8px 20px rgba(99,102,241,0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(236,72,153,0.45); }
    .btn-ghost {
      background: rgba(99,102,241,0.08);
      color: var(--primary);
      border: 1px solid rgba(99,102,241,0.2);
    }
    .btn-ghost:hover { background: rgba(99,102,241,0.15); transform: translateY(-1px); }

    .invalid {
      text-align: center;
      padding: 2.5rem 1.5rem;
    }
    .invalid .ic {
      width: 64px; height: 64px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(239,68,68,0.15), rgba(236,72,153,0.15));
      color: var(--danger);
      display: grid; place-items: center;
      font-size: 1.6rem;
    }
    .invalid h3 { margin-bottom: 6px; font-size: 1.2rem; }
    .invalid p { color: var(--muted); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <a href="/index.html" class="home-link"><i class="fas fa-arrow-left"></i> Home</a>

  <article class="ticket" id="ticket-card">
    <!-- filled by inline JS below -->
  </article>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      // Short keys to keep the QR payload compact: t=ticket, b=bookingId,
      // n=name, e=event, d=date, l=location, i=seat index, m=total seats
      const data = {
        ticketCode: params.get('t') || '',
        bookingId:  params.get('b') || '',
        name:       params.get('n') || '',
        event:      params.get('e') || '',
        date:       params.get('d') || '',
        location:   params.get('l') || '',
        place:      params.get('p') || '',
        mapUrl:     params.get('g') || '',
        seat:       params.get('i') || '',
        total:      params.get('m') || ''
      };

      const card = document.getElementById('ticket-card');
      const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const formatWhen = iso => {
        if (!iso) return 'TBD';
        const d = new Date(iso);
        if (isNaN(d)) return iso;
        return d.toLocaleString(undefined, {
          weekday: 'short', day: '2-digit', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      };

      // No ticketCode in URL → clearly invalid scan.
      if (!data.ticketCode) {
        card.innerHTML = `
          <div class="invalid">
            <div class="ic"><i class="fas fa-circle-exclamation"></i></div>
            <h3>This ticket link is invalid</h3>
            <p>The QR code didn't carry any ticket information. If this is unexpected, ask the ticket holder to re-share their ticket.</p>
            <a href="/index.html" class="btn btn-primary"><i class="fas fa-house"></i> Back to home</a>
          </div>`;
        return;
      }

      const seatLabel = (data.seat && data.total)
        ? `Ticket #${escapeHtml(data.seat)} of ${escapeHtml(data.total)}`
        : (data.seat ? `Ticket #${escapeHtml(data.seat)}` : 'Ticket');

      card.innerHTML = `
        <div class="t-head">
          <span class="t-status"><span class="pulse"></span> Valid ticket</span>
          <div class="t-check"><i class="fas fa-check"></i></div>
          <div class="t-event">${escapeHtml(data.event || 'Event')}</div>
          <div class="t-seat">${seatLabel}</div>
        </div>
        <div class="t-perf"><div class="dashes"></div></div>
        <div class="t-body">
          <div class="row">
            <div class="row-icon"><i class="fas fa-user"></i></div>
            <div>
              <div class="label">Ticket holder</div>
              <div class="value">${escapeHtml(data.name || '—')}</div>
            </div>
          </div>
          <div class="row">
            <div class="row-icon"><i class="fas fa-calendar-days"></i></div>
            <div>
              <div class="label">Event date &amp; time</div>
              <div class="value">${escapeHtml(formatWhen(data.date))}</div>
            </div>
          </div>
          ${data.location ? `
          <div class="row">
            <div class="row-icon"><i class="fas fa-map-marker-alt"></i></div>
            <div>
              <div class="label">Venue</div>
              <div class="value">${escapeHtml(data.location)}${data.place ? `, <span style="font-weight:500;color:var(--muted);">${escapeHtml(data.place)}</span>` : ''}</div>
            </div>
          </div>` : ''}
          <div class="row">
            <div class="row-icon"><i class="fas fa-ticket"></i></div>
            <div>
              <div class="label">Ticket code</div>
              <div class="value muted-mono">${escapeHtml(data.ticketCode)}</div>
            </div>
          </div>
          ${data.bookingId ? `
          <div class="row">
            <div class="row-icon"><i class="fas fa-receipt"></i></div>
            <div>
              <div class="label">Booking reference</div>
              <div class="value muted-mono">#${escapeHtml(data.bookingId)}</div>
            </div>
          </div>` : ''}
        </div>
        ${data.mapUrl ? `
        <div style="padding: 0 1.6rem 0.6rem;">
          <a href="${escapeHtml(data.mapUrl)}" target="_blank" rel="noopener" style="
            display:flex; align-items:center; justify-content:center; gap:10px;
            padding:0.95rem 1rem;
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            color:white; border-radius:14px;
            font-weight:700; font-size:0.95rem;
            text-decoration:none;
            box-shadow: 0 10px 24px rgba(16,185,129,0.35);
            transition: transform 0.25s, box-shadow 0.25s;
          " onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 14px 30px rgba(6,182,212,0.45)';"
             onmouseout="this.style.transform='';this.style.boxShadow='0 10px 24px rgba(16,185,129,0.35)';">
            <i class="fas fa-map-location-dot"></i> Get directions
          </a>
        </div>` : ''}
        <div class="t-actions">
          <a href="/index.html" class="btn btn-ghost"><i class="fas fa-house"></i> Home</a>
          <a href="/Public/User/pages/booking-history.html" class="btn btn-primary"><i class="fas fa-ticket"></i> My Bookings</a>
        </div>
      `;

      // Update the page title with the event name so it's nicer in tabs.
      if (data.event) document.title = `${data.event} — Ticket`;
    })();
  </script>
</body>
</html>
