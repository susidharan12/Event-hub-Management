# nginx config for the EventHub frontend container.
# Serves the static site and proxies /api & /uploads to the Node backend.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Reasonable defaults
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    client_max_body_size 12M;     # event cover uploads up to ~10MB

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Static files ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # DEV: do NOT cache HTML or CSS/JS so edits show on a normal refresh.
    # (Images still get a short cache.) Re-enable long-cache for production.
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
    location ~* \.(?:css|js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── API reverse-proxy ────────────────────────────────────
    # Frontend code can use same-origin /api/... — no CORS needed.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE support for /api/ai/chat — disable buffering, allow long streams
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── socket.io (live seat map) ────────────────────────────
    # WebSocket upgrade proxied to the Node backend so the browser can use
    # same-origin ws://<host>/socket.io without CORS.
    location /socket.io/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
    }

    # Event images / avatars stored on the backend's /uploads volume.
    # `^~` ensures this prefix wins over the regex extension match above,
    # otherwise nginx routes /uploads/foo.jpg to the static-file location
    # and 404s because the file lives on the backend, not in the nginx image.
    location ^~ /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}
