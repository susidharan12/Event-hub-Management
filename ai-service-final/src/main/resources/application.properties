# =============================================
# Groq (OpenAI-compatible API)
# =============================================
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
groq.max-tokens=1024


# System prompt
groq.system-prompt=You are EventHub AI, a helpful assistant for an event management platform. Help users with event ideas, writing event descriptions, promotion tips, ticket pricing suggestions, and general event planning advice. Be friendly, concise, and practical.

# Server
server.port=8080

# CORS
cors.allowed-origins=http://127.0.0.1:5050,http://localhost:5050,http://localhost:3000


